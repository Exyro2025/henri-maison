<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Henri — Activity Ledger</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #e8d5a3;
    --gold-dim: #7a6230;
    --dark: #0a0a0a;
    --dark2: #111111;
    --dark3: #1a1a1a;
    --dark4: #222222;
    --text: #e8e0d0;
    --text-dim: #9a9080;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
    min-height: 100vh;
  }

  /* PIN SCREEN */
  #pin-screen {
    position: fixed; inset: 0;
    background: var(--dark);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }

  #pin-screen .crest {
    font-family: 'Cormorant Garamond', serif;
    font-size: 3rem;
    color: var(--gold);
    letter-spacing: 0.3em;
    margin-bottom: 0.25rem;
  }

  #pin-screen .subtitle {
    font-size: 0.65rem;
    letter-spacing: 0.4em;
    color: var(--gold-dim);
    text-transform: uppercase;
    margin-bottom: 3rem;
  }

  .pin-dots {
    display: flex;
    gap: 1rem;
    margin-bottom: 2.5rem;
  }

  .pin-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    border: 1px solid var(--gold-dim);
    transition: background 0.2s;
  }

  .pin-dot.filled { background: var(--gold); border-color: var(--gold); }

  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 64px);
    gap: 0.75rem;
  }

  .key {
    width: 64px; height: 64px;
    border-radius: 50%;
    border: 1px solid var(--gold-dim);
    background: transparent;
    color: var(--text);
    font-family: 'Montserrat', sans-serif;
    font-size: 1.1rem;
    font-weight: 300;
    cursor: pointer;
    transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
  }

  .key:hover { border-color: var(--gold); color: var(--gold); }
  .key:active { background: var(--gold-dim); }
  .key.empty { border: none; cursor: default; }
  .key.del { font-size: 0.75rem; letter-spacing: 0.05em; color: var(--text-dim); }

  #pin-error {
    margin-top: 1.5rem;
    font-size: 0.65rem;
    letter-spacing: 0.25em;
    color: #c0392b;
    opacity: 0;
    transition: opacity 0.3s;
    text-transform: uppercase;
  }

  /* MAIN */
  #main { display: none; }

  header {
    border-bottom: 1px solid var(--dark4);
    padding: 1.5rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0;
    background: var(--dark);
    z-index: 10;
  }

  .logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.6rem;
    color: var(--gold);
    letter-spacing: 0.3em;
  }

  .logo span {
    display: block;
    font-size: 0.5rem;
    letter-spacing: 0.45em;
    color: var(--gold-dim);
    text-transform: uppercase;
    margin-top: -0.2rem;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  #filter-select {
    background: var(--dark3);
    border: 1px solid var(--dark4);
    color: var(--text-dim);
    padding: 0.4rem 0.8rem;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    border-radius: 2px;
    cursor: pointer;
    outline: none;
  }

  #filter-select:focus { border-color: var(--gold-dim); }

  .refresh-btn {
    background: none;
    border: 1px solid var(--gold-dim);
    color: var(--gold-dim);
    padding: 0.4rem 1rem;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
  }

  .refresh-btn:hover { border-color: var(--gold); color: var(--gold); }

  /* SUMMARY STRIP */
  .summary-strip {
    display: flex;
    gap: 1px;
    background: var(--dark4);
    border-bottom: 1px solid var(--dark4);
  }

  .summary-cell {
    flex: 1;
    background: var(--dark2);
    padding: 1.25rem 2rem;
    text-align: center;
  }

  .summary-cell .label {
    font-size: 0.55rem;
    letter-spacing: 0.35em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 0.4rem;
  }

  .summary-cell .value {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.6rem;
    color: var(--gold);
    font-weight: 300;
  }

  /* TABLE */
  .table-wrap {
    padding: 2rem;
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.75rem;
  }

  thead th {
    font-size: 0.55rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold-dim);
    text-align: left;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--dark4);
    white-space: nowrap;
  }

  tbody tr {
    border-bottom: 1px solid var(--dark3);
    transition: background 0.15s;
  }

  tbody tr:hover { background: var(--dark3); }

  tbody td {
    padding: 1rem;
    vertical-align: top;
    line-height: 1.5;
  }

  td.date-col {
    color: var(--text-dim);
    font-size: 0.65rem;
    white-space: nowrap;
    min-width: 140px;
  }

  td.category-col {
    white-space: nowrap;
  }

  .category-badge {
    display: inline-block;
    padding: 0.2rem 0.6rem;
    font-size: 0.55rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    border-radius: 2px;
    border: 1px solid;
  }

  .cat-calls { color: #7ab8d4; border-color: #7ab8d430; background: #7ab8d410; }
  .cat-reservations { color: #a8c98a; border-color: #a8c98a30; background: #a8c98a10; }
  .cat-household { color: #d4a574; border-color: #d4a57430; background: #d4a57410; }
  .cat-travel { color: #c9a84c; border-color: #c9a84c30; background: #c9a84c10; }
  .cat-general { color: var(--text-dim); border-color: #9a908030; background: #9a908010; }

  td.vendor-col {
    font-weight: 400;
    color: var(--text);
  }

  td.task-col {
    color: var(--text-dim);
    max-width: 280px;
  }

  td.outcome-col {
    color: var(--text);
    max-width: 220px;
  }

  td.amount-col {
    color: var(--gold);
    font-family: 'Cormorant Garamond', serif;
    font-size: 1rem;
    white-space: nowrap;
    text-align: right;
  }

  /* EMPTY / LOADING */
  .state-msg {
    text-align: center;
    padding: 5rem 2rem;
    color: var(--text-dim);
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  .state-msg em {
    display: block;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.4rem;
    letter-spacing: 0.1em;
    color: var(--gold-dim);
    margin-bottom: 0.5rem;
    text-transform: none;
  }

  /* PRINT */
  @media print {
    #pin-screen { display: none !important; }
    #main { display: block !important; }
    header .refresh-btn, #filter-select { display: none; }
    body { background: white; color: black; }
    .summary-strip { background: #eee; }
    .summary-cell { background: #f9f9f9; }
  }

  @media (max-width: 600px) {
    .table-wrap { padding: 1rem; }
    header { padding: 1rem; }
    .summary-cell { padding: 1rem; }
    .summary-cell .value { font-size: 1.2rem; }
    td.task-col, td.outcome-col { display: none; }
  }
</style>
</head>
<body>

<!-- PIN SCREEN -->
<div id="pin-screen">
  <div class="crest">H</div>
  <div class="subtitle">Henri &mdash; Activity Ledger</div>
  <div class="pin-dots">
    <div class="pin-dot" id="d0"></div>
    <div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div>
    <div class="pin-dot" id="d3"></div>
    <div class="pin-dot" id="d4"></div>
    <div class="pin-dot" id="d5"></div>
  </div>
  <div class="keypad">
    <button class="key" onclick="pressKey('1')">1</button>
    <button class="key" onclick="pressKey('2')">2</button>
    <button class="key" onclick="pressKey('3')">3</button>
    <button class="key" onclick="pressKey('4')">4</button>
    <button class="key" onclick="pressKey('5')">5</button>
    <button class="key" onclick="pressKey('6')">6</button>
    <button class="key" onclick="pressKey('7')">7</button>
    <button class="key" onclick="pressKey('8')">8</button>
    <button class="key" onclick="pressKey('9')">9</button>
    <button class="key empty"></button>
    <button class="key" onclick="pressKey('0')">0</button>
    <button class="key del" onclick="deleteKey()">DEL</button>
  </div>
  <div id="pin-error">Incorrect PIN</div>
</div>

<!-- MAIN LEDGER -->
<div id="main">
  <header>
    <div class="logo">
      HENRI
      <span>Activity Ledger</span>
    </div>
    <div class="header-right">
      <select id="filter-select" onchange="applyFilter()">
        <option value="all">All Categories</option>
        <option value="Calls">Calls</option>
        <option value="Reservations">Reservations</option>
        <option value="Household">Household</option>
        <option value="Travel">Travel</option>
        <option value="General">General</option>
      </select>
      <button class="refresh-btn" onclick="loadLogs()">&#8635; Refresh</button>
    </div>
  </header>

  <div class="summary-strip">
    <div class="summary-cell">
      <div class="label">Total Entries</div>
      <div class="value" id="stat-total">—</div>
    </div>
    <div class="summary-cell">
      <div class="label">This Month</div>
      <div class="value" id="stat-month">—</div>
    </div>
    <div class="summary-cell">
      <div class="label">Calls Made</div>
      <div class="value" id="stat-calls">—</div>
    </div>
    <div class="summary-cell">
      <div class="label">Amounts Logged</div>
      <div class="value" id="stat-amount">—</div>
    </div>
  </div>

  <div class="table-wrap">
    <table id="log-table">
      <thead>
        <tr>
          <th>Date &amp; Time</th>
          <th>Category</th>
          <th>Vendor / Contact</th>
          <th>Task</th>
          <th>Outcome</th>
          <th style="text-align:right">Amount</th>
        </tr>
      </thead>
      <tbody id="log-body">
        <tr>
          <td colspan="6" class="state-msg">
            <em>Loading...</em>
            Fetching records
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  const PIN = '081939';
  let pinEntry = '';
  let allLogs = [];

  function pressKey(k) {
    if (pinEntry.length >= 6) return;
    pinEntry += k;
    document.getElementById('d' + (pinEntry.length - 1)).classList.add('filled');
    if (pinEntry.length === 6) {
      setTimeout(checkPin, 200);
    }
  }

  function deleteKey() {
    if (!pinEntry.length) return;
    pinEntry = pinEntry.slice(0, -1);
    document.getElementById('d' + pinEntry.length).classList.remove('filled');
    document.getElementById('pin-error').style.opacity = '0';
  }

  function checkPin() {
    if (pinEntry === PIN) {
      document.getElementById('pin-screen').style.display = 'none';
      document.getElementById('main').style.display = 'block';
      loadLogs();
    } else {
      document.getElementById('pin-error').style.opacity = '1';
      pinEntry = '';
      for (let i = 0; i < 6; i++) {
        document.getElementById('d' + i).classList.remove('filled');
      }
    }
  }

  document.addEventListener('keydown', e => {
    if (document.getElementById('pin-screen').style.display === 'none') return;
    if (e.key >= '0' && e.key <= '9') pressKey(e.key);
    if (e.key === 'Backspace') deleteKey();
  });

  async function loadLogs() {
    try {
      const res = await fetch('/api/log', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'get_logs' })
      });
      const data = await res.json();
      allLogs = data.logs || [];
      renderLogs(allLogs);
      updateStats(allLogs);
    } catch (e) {
      document.getElementById('log-body').innerHTML = `
        <tr><td colspan="6" class="state-msg">
          <em>Unable to load</em>
          ${e.message}
        </td></tr>`;
    }
  }

  function applyFilter() {
    const cat = document.getElementById('filter-select').value;
    const filtered = cat === 'all' ? allLogs : allLogs.filter(l => l.category === cat);
    renderLogs(filtered);
  }

  function categoryClass(cat) {
    const map = {
      'Calls': 'cat-calls',
      'Reservations': 'cat-reservations',
      'Household': 'cat-household',
      'Travel': 'cat-travel',
      'General': 'cat-general'
    };
    return map[cat] || 'cat-general';
  }

  function renderLogs(logs) {
    const tbody = document.getElementById('log-body');
    if (!logs.length) {
      tbody.innerHTML = `
        <tr><td colspan="6" class="state-msg">
          <em>No entries yet</em>
          Henri will log completed tasks here
        </td></tr>`;
      return;
    }

    tbody.innerHTML = logs.map(log => `
      <tr>
        <td class="date-col">${log.date || '—'}</td>
        <td class="category-col">
          <span class="category-badge ${categoryClass(log.category)}">${log.category || 'General'}</span>
        </td>
        <td class="vendor-col">${log.vendor || '—'}</td>
        <td class="task-col">${log.task || '—'}</td>
        <td class="outcome-col">${log.outcome || '—'}</td>
        <td class="amount-col">${log.amount ? '$' + Number(log.amount).toFixed(2) : '—'}</td>
      </tr>
    `).join('');
  }

  function updateStats(logs) {
    document.getElementById('stat-total').textContent = logs.length;

    const now = new Date();
    const monthCount = logs.filter(l => {
      if (!l.date) return false;
      const d = new Date(l.date);
      return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    }).length;
    document.getElementById('stat-month').textContent = monthCount;

    const callCount = logs.filter(l => l.category === 'Calls').length;
    document.getElementById('stat-calls').textContent = callCount;

    const totalAmt = logs.reduce((sum, l) => sum + (l.amount ? Number(l.amount) : 0), 0);
    document.getElementById('stat-amount').textContent = totalAmt > 0 ? '$' + totalAmt.toFixed(2) : '—';
  }
</script>
</body>
</html>
